[project]
name = "crm-lite-service"
version = "0.1.0"
description = "CRM Lite — FastAPI business services (leads, campaigns, accounts, opportunities, sales cadence)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.139.2",
    "uvicorn[standard]==0.51.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "sqlalchemy==2.0.51",
    "alembic==1.18.5",
    "psycopg[binary]==3.3.4",      # PostgreSQL; add pyodbc when moving to Azure SQL
    "swagger-ui-bundle==1.1.0",    # serves /docs from local static assets, no CDN dependency
    "httpx==0.28.1",               # outbound calls to the AI provider (src/services/llm_client.py)
    "bcrypt>=5.0.0",
    "pyjwt>=2.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.22",
    "mypy==2.3.0",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
